
name: Backup da estrutura do Neon

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Exportar estrutura do banco
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          mkdir -p database

          rm -f database/database_completa.sql
          rm -f database/tabelas/*.sql

          docker run --rm \
            -e NEON_DATABASE_URL \
            -v "$GITHUB_WORKSPACE:/work" \
            postgres:18 \
            sh -c 'pg_dump "$NEON_DATABASE_URL" --schema-only --no-owner --no-privileges --format=plain --file=/work/database/estrutura.sql'

      - name: Salvar alteracoes no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A database/

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao encontrada."
          else
            git commit -m "Atualiza estrutura do banco Neon"
            git push
          fi

## 14. Considerações finais

O projeto demonstra a aplicação prática dos conceitos de bancos de dados relacionais por meio da construção de uma estrutura organizada, com relacionamentos definidos e regras de integridade.

A utilização do PostgreSQL permite gerenciar as informações com consistência, enquanto o Neon oferece hospedagem em nuvem e o GitHub possibilita o versionamento, a documentação e a automação dos backups.

O resultado é uma base de dados estruturada para gerenciamento de vendas, com possibilidade de expansão e integração com aplicações externas.

